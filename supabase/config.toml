# Supabase config for PalengkeGo Edge Functions.
#
# All functions verify Firebase ID tokens themselves (Authorization: Bearer,
# via the FIREBASE_SERVICE_ACCOUNT secret) — so Supabase's own JWT check is
# disabled per function. The webhook is called server-to-server by PayMongo
# and carries no JWT at all.
#
# Before deploying: set `project_id` to your Supabase project id (or run
# `supabase link`, which fills it in), create the Firebase Admin service
# account JSON and store it as a secret:
#   supabase secret set FIREBASE_SERVICE_ACCOUNT="$(Get-Content sa.json -Raw)"
#   supabase secret set PAYMONGO_WEBHOOK_SECRET="whsec_..."
# Then: supabase functions deploy

project_id = "palengkego"

# PalengkeGo edge functions (audit 2026-09-13): the order/review edges were
# removed — the client calls the Firebase callables now. Only the PayMongo
# webhook fallback and the storage authorization functions remain.

[tool.edge.functions.paymongo-webhook]
verify_jwt = false

[tool.edge.functions.storage-upload]
verify_jwt = false

[tool.edge.functions.storage-sign]
verify_jwt = false
